# Fanyu harness Desktop packaging — unsigned Windows, Linux and macOS artifacts.
#
# WHERE THIS FILE LIVES
# This repository's root *is* the code directory, so GitHub reads this file where it is.
# It used to sit in a workspace root one level above the code, which forced a
# `fanyu-harness` working directory and a matching path prefix on every artifact. Those
# are gone: the paths below are now relative to the repository root, exactly like the
# upstream workflows beside it.
#
# WHY THIS WORKFLOW EXISTS
# The upstream Desktop workflows target DeepSeek's self-hosted runners and real
# signing credentials:
#   .github/workflows/windows-package.yml    -> runs-on: dsh-win-package-trial
#   .github/workflows/macos-package.yml      -> runs-on: [self-hosted, macOS, ARM64, dsh-mac-package-trial]
#   .github/workflows/macos-intel-package.yml-> same self-hosted ARM64 machine, through Rosetta
# Those machines are not available here (and are unreachable from a hosted runner
# anyway), and this repository holds no certificates. This workflow is their
# hosted-runner, credential-free counterpart: GitHub-hosted runners only, unsigned
# artifacts only, no secrets, and no publication of any kind.
#
# macOS IS INCLUDED AGAIN
# It was dropped once, deliberately: on a PRIVATE repository GitHub bills macOS runner
# minutes at 10x the Linux rate (Windows at 2x), so a three-platform run costs roughly
# 500 of the 2000 free minutes per month. It is back because the three-platform matrix
# is the point of this workflow and the minute cost is an accepted tradeoff; making the
# repository public removes the cap entirely. The leg builds `mac-arm64` on `macos-15`
# (the Apple Silicon image) through `package:mac:arm64:unsigned`.
#
# INTEL MACS ARE STILL ABSENT, and that one is deliberate. `mac-x64` needs an Intel
# host or Rosetta, the payload differs and cannot be exercised on the arm64 image, and
# a `macos-15-intel` leg would double the macOS minute cost. Add an `mac-x64` entry
# with runner `macos-15-intel` (command `package:mac:x64:unsigned`) if Intel support is
# ever required.
#
# Each leg builds the platform's own unsigned mode, which by design needs no release
# configuration: Linux and macOS each reach a local environment with no dotenv file at
# all (macOS ad-hoc signs the bundle). Windows is the exception and gets a placeholder
# .env.windows, because an unsigned Windows build still ships and validates the
# mandatory-update policy it was built with; those placeholder origins are never
# contacted.
#
# Windows needs the MSVC C++ toolset (the installer shell compiles
# `installer/window-frame.cpp` and the packaging script hard-fails without
# `Microsoft.VisualStudio.Component.VC.Tools.x86.x64`). `windows-latest` ships it.
#
# NOT INCLUDED, DELIBERATELY: publishing, uploads, update feeds, notarization, code
# signing, and the first-window launch gate. Each leg checks the payload it produced
# instead: Linux extracts the AppImage, macOS mounts the DMG, and a full first-window
# launch gate would need a virtual display.
name: Desktop packages (unsigned, windows + linux + macos)

on:
  workflow_dispatch:
  push:
    # Deliberately not `desktop-v*`: that prefix belongs to the signed publication flow.
    tags:
      - 'fanyu-desktop-v*'

permissions:
  contents: read

concurrency:
  group: fanyu-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package:
    name: Package ${{ matrix.target }} (unsigned)
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runs-on: ubuntu-24.04
            script: package:linux:x64:unsigned
            artifacts: apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts
          - target: win-x64
            runs-on: windows-latest
            script: package:win:x64:unsigned
            artifacts: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts
          - target: mac-arm64
            # The Apple Silicon image; `mac-arm64` is refused on any other host.
            runs-on: macos-15
            script: package:mac:arm64:unsigned
            artifacts: apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts
          # No Intel macOS leg: see "INTEL MACS ARE STILL ABSENT" at the top of this file.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Configure runner-private caches
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # The shared package cache keeps the Electron archive and the prepared pnpm store across
          # runs; it must stay outside the checkout, which this job reuses from a fresh clone.
          echo "DSH_DESKTOP_PACKAGE_CACHE_DIR=${{ runner.tool_cache }}/fanyu-desktop-package-cache" >> "$GITHUB_ENV"
          echo "PNPM_CONFIG_STORE_DIR=${{ runner.tool_cache }}/fanyu-desktop-package-cache/workspace-pnpm-store" >> "$GITHUB_ENV"
          echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"
          # The bundled runtime is installed through a nested pnpm run; keep it off the public
          # registry's slow path without changing the product's default registry.
          echo "DSH_DESKTOP_NPM_REGISTRY=${{ vars.DSH_DESKTOP_NPM_REGISTRY || 'https://registry.npmjs.org' }}" >> "$GITHUB_ENV"

      - name: Configure runner-private caches
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cache = "${{ runner.tool_cache }}/fanyu-desktop-package-cache"
          "DSH_DESKTOP_PACKAGE_CACHE_DIR=$cache" >> $env:GITHUB_ENV
          "PNPM_CONFIG_STORE_DIR=$cache/workspace-pnpm-store" >> $env:GITHUB_ENV
          "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> $env:GITHUB_ENV
          "DSH_DESKTOP_NPM_REGISTRY=${{ vars.DSH_DESKTOP_NPM_REGISTRY || 'https://registry.npmjs.org' }}" >> $env:GITHUB_ENV

      - uses: pnpm/action-setup@v5.0.0
        with:
          # Pinned to the workspace's own `packageManager` value in `package.json`, which now
          # sits at this repository's root and can be discovered. It stays stated explicitly so
          # a future root-level manifest cannot silently change the pnpm that builds releases;
          # update it together with `package.json`.
          version: 11.28.5
          # A job-private installation: matrix legs share one checkout path.
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install AppImage build dependencies
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          sudo apt-get update
          # FUSE 2 was renamed libfuse2t64 on Ubuntu 24.04 (the 64-bit time_t transition), and
          # squashfs-tools provides the unsquashfs the payload check below uses.
          sudo apt-get install -y --no-install-recommends squashfs-tools
          sudo apt-get install -y --no-install-recommends libfuse2t64 2>/dev/null \
            || sudo apt-get install -y --no-install-recommends libfuse2

      - name: Write the placeholder Windows release settings
        if: matrix.target == 'win-x64'
        shell: pwsh
        run: |
          # An unsigned Windows build still carries the mandatory-update policy, and validating it
          # requires an HTTPS origin for the selected deployment plus a nonempty login allow-list
          # for test. These are unreachable placeholder hosts: nothing contacts them during a build,
          # and no certificate, token or secret is involved. The .example template is the authority
          # on which settings a real signed build needs.
          $settings = @(
            'DSH_DESKTOP_APP_ID=com.fanyu.harness'
            'DSH_DESKTOP_AUTO_UPDATE_ENV=test'
            'DOWNLOAD_TEST_ORIGIN=https://updates.invalid'
            'DOWNLOAD_TEST_RELEASE_ID=00000000000000000000000000000000'
            'DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://policy.invalid'
            'DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://policy.invalid'
            'DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://login.invalid"]}'
            'DSH_DESKTOP_WINDOWS_SIGNATURE_CACHE_CONCURRENCY=4'
            'DSH_DESKTOP_WINDOWS_COMPRESSION_LEVEL=3'
          )
          # The loader rejects a BOM, NUL bytes and any setting the platform template does not own.
          Set-Content -Path apps/desktop/.env.windows -Value $settings -Encoding utf8NoBOM
          Get-Content apps/desktop/.env.windows

      - name: Package ${{ matrix.target }}
        run: pnpm --dir apps/desktop run ${{ matrix.script }}

      - name: Check the packaged AppImage payload
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          directory='apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts'
          shopt -s nullglob
          images=("$directory"/*.AppImage)
          if [[ ${#images[@]} -ne 1 ]]; then
            echo "::error::expected exactly one AppImage in $directory, found ${#images[@]}"
            exit 1
          fi
          work=$(mktemp -d)
          # An AppImage mounts itself through FUSE, which a container runner does not offer; the
          # runtime can unpack itself instead and that path needs no kernel module.
          # `$PWD` is the repository root, so this resolves the relative artifact path.
          ( cd "$work" && "$PWD/${images[0]}" --appimage-extract ) > /dev/null
          test -x "$work/squashfs-root/AppRun"
          test -x "$work/squashfs-root/fanyu-harness"
          test -f "$work/squashfs-root/fanyu-harness.desktop"
          grep -q '^Exec=fanyu-harness' "$work/squashfs-root/fanyu-harness.desktop"

      - name: Check the packaged macOS payload
        if: matrix.target == 'mac-arm64'
        shell: bash
        run: |
          set -euo pipefail
          directory='apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts'
          shopt -s nullglob
          # electron-builder emits `dmg` only for an unsigned macOS build; the `zip` target belongs
          # to the signed publication flow, so requiring one here would fail every run.
          images=("$directory"/*.dmg)
          if [[ ${#images[@]} -ne 1 ]]; then
            echo "::error::expected exactly one .dmg in $directory, found ${#images[@]}"
            exit 1
          fi
          test -f "$directory/mac-arm64/fanyu-harness.app/Contents/Info.plist"
          # The DMG is the artifact a user opens, so verify the filesystem image it carries rather
          # than only the app directory electron-builder staged beside it. The packaged runtime smoke
          # has already launched that directory, which is why this stays a structural check.
          mount=$(mktemp -d)
          hdiutil attach "${images[0]}" -nobrowse -readonly -noverify -mountpoint "$mount" > /dev/null
          trap 'hdiutil detach "$mount" > /dev/null 2>&1 || true' EXIT
          shopt -s nullglob
          applications=("$mount"/*.app)
          if [[ ${#applications[@]} -ne 1 ]]; then
            echo "::error::expected exactly one .app at the root of ${images[0]}, found ${#applications[@]}"
            exit 1
          fi
          test -x "${applications[0]}/Contents/MacOS/fanyu-harness"
          test -f "${applications[0]}/Contents/Resources/app.asar"
          hdiutil detach "$mount" > /dev/null

      - name: Upload ${{ matrix.target }} artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fanyu-harness-${{ matrix.target }}-unsigned
          path: |
            ${{ matrix.artifacts }}/*.AppImage
            ${{ matrix.artifacts }}/*.deb
            ${{ matrix.artifacts }}/*.tar.gz
            ${{ matrix.artifacts }}/*.exe
            ${{ matrix.artifacts }}/*.dmg
            ${{ matrix.artifacts }}/*.zip
            ${{ matrix.artifacts }}/*-release.json
          if-no-files-found: error
          retention-days: 14
